site_name: JST CRM Runbook
theme:
  name: material
  features:
    - navigation.sections
    - search.suggest
    - content.code.copy
markdown_extensions:
  - admonition
  - tables
  - pymdownx.superfences
nav:
  - Start here: index.md
  - Deploy:
      - Automatic (CI/CD): deploy/automatic.md
      - By hand: deploy/manual.md
      - Roll back: deploy/rollback.md
  - Maintenance:
      - Health check: maintenance/health-checks.md
      - Backups: maintenance/backups.md
      - Passwords and keys: maintenance/secrets.md
  - When it crashes:
      - Site is down: crashes/site-down.md
      - Restore the database: crashes/restore-database.md
      - Failed database update: crashes/bad-migration.md
      - Server is gone: crashes/server-lost.md
